<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./styles.css">
    <title>Ticket Details</title>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <div id="navbar-container"></div>
    <div class="mt-4">
        <div id="product-detail">
            <h1>Loading Product...</h1>
        </div>

        <script>
            function getProductIdFromURL() {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('id');
            }

            const ProductId = getProductIdFromURL() || 1;

            fetch(`/api/products/${ProductId}`)
                .then(res => res.json())
                .then(product => {
                    document.getElementById('product-detail').innerHTML = `
                        <div class="container-fluid p-0">
                            <div class="row justify-content-center">
                                <div class="card border-0" style="width: 60%;">
                                    <img src="./${product.ImageURL}" class=" card-img-top rounded-5 d-block w-100 h-50 object-fit-cover"
                                        style="object-position: top;" alt="Card image cap">
                                    <div class="container">
                                        <div class="row">
                                            <div class="col-sm-8">
                                                <div class="card-body">
                                                    <h1>${product.ProductName}</h1>
                                                    <h4> Synopsis: <br> </h4>
                                                    <p>${product.Description}</p>
                                                </div>
                                            </div>
                                            <div class="col-sm-4">
                                                <div class="mt-5">
                                                    <div class="card " style="width: 18rem;">
                                                        <div class="card-body">
                                                            <h5 class="card-title">Price: </h5>
                                                            <p class="card-text">$${product.Price}</p>
                                                            <a href="Purchase.html" class="btn btn-primary w-100">Buy Ticket</a>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
        `;
                })
                .catch(error => {
                    document.getElementById('product-detail').innerHTML = `
            <h1>Product Not Found</h1>
            <p>Error: ${error.message}</p>
            <a href="Home.html">Back to Home</a>
        `;
                });
        </script>
        <script src="./scripts/load-navbar.js"></script>
    </div>
</body>
